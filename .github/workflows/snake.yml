name: Generate Contribution Snake Animation

on:
  schedule:
    # Run every 24 hours at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Contribution Grid Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Diyan4444
          outputs: |
            assets/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#ff3355&color_dots=#161820,#4c1d1d,#881337,#ea580c,#ff6b35

      - name: Commit and push generated asset
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add assets/github-contribution-grid-snake.svg
          if git diff --staged --quiet; then
            echo "No changes in snake animation."
          else
            git commit -m "chore(telemetry): refresh contribution snake animation [skip ci]"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

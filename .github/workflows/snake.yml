name: Generate Contribution Calendar & Snake

on:
  schedule:
    # Run every 6 hours to capture new commits & contributions automatically
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Dark Flame Contribution Graph SVG
        run: |
          python scripts/generate_contribution_graph.py

      - name: Generate GitHub Contribution Grid Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Diyan4444
          outputs: |
            assets/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#ff3355&color_dots=#161820,#4c1d1d,#881337,#ea580c,#ff6b35

      - name: Commit and push generated telemetry assets
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add assets/contribution-graph.svg assets/github-contribution-grid-snake.svg
          if git diff --staged --quiet; then
            echo "No changes in contribution graph or snake animation."
          else
            git commit -m "chore(telemetry): auto-update contribution graph and snake [skip ci]"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="quoteBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111622"/>
      <stop offset="50%" stop-color="#161c28"/>
      <stop offset="100%" stop-color="#141924"/>
    </linearGradient>

    <linearGradient id="warmRule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea937d" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#dfb17b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7eb2a8" stop-opacity="0.4"/>
    </linearGradient>

    <pattern id="softGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#253245" stroke-width="0.75" stroke-opacity="0.45"/>
    </pattern>

    <style>
      .quote-main {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
        font-size: 27px;
        font-weight: 700;
        fill: #f1ede6;
        letter-spacing: 0.3px;
      }
      .quote-accent {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
        font-size: 27px;
        font-weight: 700;
        fill: #ea937d;
        letter-spacing: 0.3px;
      }
      .quote-mark {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 84px;
        font-weight: 700;
        fill: #ea937d;
        fill-opacity: 0.85;
      }
      .author {
        font-family: 'JetBrains Mono', Consolas, 'SF Mono', monospace;
        font-size: 12px;
        font-weight: 600;
        fill: #8696a7;
        letter-spacing: 0.6px;
      }
      .tag-quiet {
        font-family: 'JetBrains Mono', Consolas, monospace;
        font-size: 10.5px;
        font-weight: 600;
        fill: #7eb2a8;
        letter-spacing: 0.6px;
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect width="960" height="200" rx="12" fill="url(#quoteBg)" stroke="#253245" stroke-width="1.2"/>
  <rect width="960" height="200" rx="12" fill="url(#softGrid)"/>

  <!-- Left Accent Notch -->
  <line x1="0" y1="20" x2="0" y2="180" stroke="#ea937d" stroke-width="4" stroke-linecap="round"/>

  <!-- Top Pill -->
  <g transform="translate(48, 26)">
    <rect width="150" height="24" rx="12" fill="#192230" stroke="#253245" stroke-width="1"/>
    <circle cx="12" cy="12" r="3.5" fill="#7eb2a8">
      <animate attributeName="opacity" values="0.5; 1; 0.5" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text x="24" y="15.5" class="tag-quiet">DEV HUMOR • QUOTE</text>
  </g>

  <!-- Big quote mark -->
  <text x="44" y="136" class="quote-mark">“</text>

  <!-- Quote text -->
  <g transform="translate(110, 94)">
    <text x="0" y="0" class="quote-main">Code is like <tspan class="quote-accent">humor.</tspan></text>
    <text x="0" y="40" class="quote-main">When you have to explain it, it’s bad.”</text>
  </g>

  <!-- Horizon rule -->
  <line x1="48" y1="158" x2="912" y2="158" stroke="url(#warmRule)" stroke-width="1"/>

  <!-- Author -->
  <text x="48" y="182" class="author">— CORY HOUSE</text>

  <!-- Right stamp motif -->
  <g transform="translate(836, 26)">
    <rect width="76" height="76" rx="10" fill="#192230" stroke="#253245" stroke-width="1"/>
    <circle cx="38" cy="38" r="26" fill="none" stroke="#314159" stroke-width="1" stroke-dasharray="3, 3">
      <animateTransform attributeName="transform" type="rotate" from="0 38 38" to="360 38 38" dur="36s" repeatCount="indefinite"/>
    </circle>
    <circle cx="38" cy="38" r="16" fill="none" stroke="#ea937d" stroke-opacity="0.3" stroke-width="1.2"/>
    <text x="38" y="42" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ea937d" font-weight="700" text-anchor="middle" letter-spacing="1">&lt;/&gt;</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 290" width="100%" height="100%">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1017"/>
      <stop offset="50%" stop-color="#121820"/>
      <stop offset="100%" stop-color="#0e141d"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0f6fc"/>
      <stop offset="60%" stop-color="#f0f6fc"/>
      <stop offset="100%" stop-color="#39d353"/>
    </linearGradient>
    <pattern id="techGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#162230" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="1.2" fill="#39d353" fill-opacity="0.2"/>
    </pattern>

    <style>
      .telemetry-text {
        font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
        font-size: 11px;
        fill: #39d353;
        letter-spacing: 1px;
      }
      .tagline-primary {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
        font-size: 15px;
        font-weight: 600;
        fill: #f0f6fc;
        letter-spacing: 0.2px;
      }
      .tagline-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
        font-size: 13.5px;
        fill: #8b949e;
        letter-spacing: 0.2px;
      }
      .name-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 42px;
        font-weight: 800;
        letter-spacing: 2px;
      }
      .badge-label {
        font-family: 'JetBrains Mono', Consolas, monospace;
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.3px;
        fill: #f0f6fc;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="960" height="290" rx="12" fill="url(#heroBg)"/>
  <rect width="960" height="290" rx="12" fill="url(#techGrid)"/>

  <!-- Top Circuit Accent Line -->
  <path d="M 30 25 L 350 25 L 365 38 L 595 38 L 610 25 L 930 25" fill="none" stroke="#1c2b3e" stroke-width="1.2"/>
  <circle cx="350" cy="25" r="2.5" fill="#39d353"/>
  <circle cx="610" cy="25" r="2.5" fill="#39d353"/>

  <!-- Top Status Pill: ONLINE / READY TO BUILD (Wider container: 290px width) -->
  <g transform="translate(40, 24)">
    <rect width="280" height="28" rx="14" fill="#132219" stroke="#234932" stroke-width="1.2"/>
    <circle cx="16" cy="14" r="4.5" fill="#39d353">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="30" y="18" class="telemetry-text">ONLINE • READY TO BUILD</text>
  </g>

  <!-- Top Right Academic Tag -->
  <g transform="translate(680, 24)">
    <rect width="240" height="28" rx="6" fill="#131b26" stroke="#1e293b" stroke-width="1.2"/>
    <text x="16" y="18" class="telemetry-text" fill="#8b949e">VJTI MUMBAI • IT SOPHOMORE</text>
  </g>

  <!-- Main Identity Content Block -->
  <g transform="translate(60, 78)">
    <!-- Subtitle / Role Tracker -->
    <text x="0" y="18" class="telemetry-text" fill="#39d353" font-weight="600">
      &gt; BUILDING SOFTWARE FROM FIRST PRINCIPLES
    </text>

    <!-- Main Title -->
    <text x="0" y="62" class="name-text" fill="url(#textGrad)">
      DIYAN SHAH
    </text>

    <!-- Exact Academic Description across two balanced lines -->
    <text x="0" y="94" class="tagline-primary">
      Information Technology Sophomore at VJTI Mumbai
    </text>
    <text x="0" y="115" class="tagline-sub">
      Engineering full-stack architectures, systems tooling, AI workflows &amp; interactive applications.
    </text>

    <!-- 4 Technical Focus Badges with generous horizontal spacing -->
    <g transform="translate(0, 138)">
      <!-- Badge 1: Academic Base (width: 140) -->
      <g transform="translate(0, 0)">
        <rect width="140" height="28" rx="5" fill="#141f2c" stroke="#1e293b" stroke-width="1"/>
        <circle cx="12" cy="14" r="3" fill="#39d353"/>
        <text x="24" y="18" class="badge-label">B.Tech IT • VJTI</text>
      </g>

      <!-- Badge 2: Full-Stack & Systems (width: 175, x: 152) -->
      <g transform="translate(152, 0)">
        <rect width="175" height="28" rx="5" fill="#141f2c" stroke="#1e293b" stroke-width="1"/>
        <circle cx="12" cy="14" r="3" fill="#22c55e"/>
        <text x="24" y="18" class="badge-label">Full Stack &amp; Systems</text>
      </g>

      <!-- Badge 3: Applied AI & Data (width: 160, x: 339) -->
      <g transform="translate(339, 0)">
        <rect width="160" height="28" rx="5" fill="#141f2c" stroke="#1e293b" stroke-width="1"/>
        <circle cx="12" cy="14" r="3" fill="#38bdf8"/>
        <text x="24" y="18" class="badge-label">Applied AI &amp; Data</text>
      </g>

      <!-- Badge 4: Interactive & Game Dev (width: 185, x: 511) -> Ends at 696px -->
      <g transform="translate(511, 0)">
        <rect width="185" height="28" rx="5" fill="#141f2c" stroke="#1e293b" stroke-width="1"/>
        <circle cx="12" cy="14" r="3" fill="#f59e0b"/>
        <text x="24" y="18" class="badge-label">Interactive &amp; Game Dev</text>
      </g>
    </g>
  </g>

  <!-- Right Decorative Node Element (Centered at x=830, y=155) -->
  <g transform="translate(830, 155)">
    <circle cx="0" cy="0" r="50" fill="none" stroke="#1a2738" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="36" fill="none" stroke="#234932" stroke-width="1.2" stroke-dasharray="4, 4"/>
    <circle cx="0" cy="0" r="22" fill="#14221b" stroke="#22c55e" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="6" fill="#39d353"/>

    <!-- Satellites -->
    <circle cx="30" cy="-22" r="3" fill="#39d353"/>
    <circle cx="-28" cy="24" r="3" fill="#f59e0b"/>
    <circle cx="-26" cy="-22" r="2.5" fill="#38bdf8"/>
    <line x1="0" y1="0" x2="30" y2="-22" stroke="#39d353" stroke-width="0.8" stroke-opacity="0.4"/>
    <line x1="0" y1="0" x2="-28" y2="24" stroke="#f59e0b" stroke-width="0.8" stroke-opacity="0.4"/>
  </g>

  <!-- Bottom Terminal Status Bar -->
  <g transform="translate(0, 258)">
    <rect width="960" height="32" fill="#090d14" stroke="#162230" stroke-width="1"/>
    <text x="35" y="20" class="telemetry-text" fill="#8b949e">
      CORE TECH: <tspan fill="#f0f6fc">TypeScript</tspan> • <tspan fill="#f0f6fc">C++</tspan> • <tspan fill="#f0f6fc">Python</tspan> • <tspan fill="#f0f6fc">Next.js</tspan> • <tspan fill="#f0f6fc">Node.js</tspan> • <tspan fill="#f0f6fc">Godot</tspan> • <tspan fill="#f0f6fc">Docker</tspan>
    </text>

    <!-- Lower-Right Badge: Fixed width 230, text x=115 text-anchor=middle. Never clips! -->
    <g transform="translate(695, 4)">
      <rect width="230" height="24" rx="4" fill="#14221b" stroke="#234932" stroke-width="1"/>
      <text x="115" y="16" class="telemetry-text" text-anchor="middle" fill="#39d353">
        17 REPOSITORIES • ACTIVE
      </text>
    </g>
  </g>

  <!-- Outer Border Frame with Corner Accents -->
  <rect x="1" y="1" width="958" height="288" rx="11" fill="none" stroke="#1c293c" stroke-width="1.2"/>
  <path d="M 1 25 L 1 1 L 25 1" fill="none" stroke="#39d353" stroke-width="2"/>
  <path d="M 935 1 L 959 1 L 959 25" fill="none" stroke="#39d353" stroke-width="2"/>
  <path d="M 1 265 L 1 289 L 25 289" fill="none" stroke="#39d353" stroke-width="2"/>
  <path d="M 935 289 L 959 289 L 959 265" fill="none" stroke="#39d353" stroke-width="2"/>
</svg>
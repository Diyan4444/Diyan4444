<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111622"/>
      <stop offset="50%" stop-color="#161c28"/>
      <stop offset="100%" stop-color="#141924"/>
    </linearGradient>

    <linearGradient id="warmRule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea937d" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#dfb17b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7eb2a8" stop-opacity="0.4"/>
    </linearGradient>

    <pattern id="softGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#253245" stroke-width="0.75" stroke-opacity="0.45"/>
    </pattern>

    <style>
      .name-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
        font-size: 34px;
        font-weight: 700;
        fill: #f1ede6;
        letter-spacing: 0.5px;
      }
      .edu-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 15px;
        font-weight: 500;
        fill: #ea937d;
        letter-spacing: 0.2px;
      }
      .intro-line {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 13.5px;
        fill: #8696a7;
        line-height: 1.5;
      }
      .tech-chip-text {
        font-family: 'JetBrains Mono', Consolas, 'SF Mono', monospace;
        font-size: 11px;
        font-weight: 500;
        fill: #c7d2df;
      }
      .tag-quiet {
        font-family: 'JetBrains Mono', Consolas, monospace;
        font-size: 10.5px;
        font-weight: 600;
        fill: #7eb2a8;
        letter-spacing: 0.6px;
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect width="960" height="240" rx="12" fill="url(#bannerBg)" stroke="#253245" stroke-width="1.2"/>
  <rect width="960" height="240" rx="12" fill="url(#softGrid)"/>

  <!-- Left Accent Notch (Notebook Spine Detail) -->
  <line x1="0" y1="20" x2="0" y2="220" stroke="#ea937d" stroke-width="4" stroke-linecap="round"/>

  <!-- Top Status / Discipline Pill -->
  <g transform="translate(48, 30)">
    <rect width="180" height="24" rx="12" fill="#192230" stroke="#253245" stroke-width="1"/>
    <circle cx="12" cy="12" r="3.5" fill="#7eb2a8">
      <animate attributeName="opacity" values="0.5; 1; 0.5" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text x="24" y="15.5" class="tag-quiet">DIYAN SHAH • MUMBAI</text>
  </g>

  <!-- Main Headline Block -->
  <g transform="translate(48, 76)">
    <text x="0" y="24" class="name-title">Diyan Shah</text>
    <text x="195" y="22" class="edu-sub">B.Tech IT sophomore at VJTI Mumbai</text>
    
    <text x="0" y="54" class="intro-line">
      I build full-stack web applications, browser tools, and hackathon prototypes.
    </text>
    <text x="0" y="73" class="intro-line">
      I like projects that solve one real problem well, and I learn best by shipping them.
    </text>
  </g>

  <!-- Calming Horizon Rule -->
  <line x1="48" y1="180" x2="912" y2="180" stroke="url(#warmRule)" stroke-width="1"/>

  <!-- Quiet Core Tech Strip -->
  <g transform="translate(48, 204)">
    <text x="0" y="0" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#8696a7" font-weight="600" letter-spacing="0.5">CORE TOOLKIT</text>
    <text x="100" y="0" class="tech-chip-text">
      TypeScript <tspan fill="#314159">•</tspan> C++ (STL) <tspan fill="#314159">•</tspan> Python <tspan fill="#314159">•</tspan> Next.js <tspan fill="#314159">•</tspan> FastAPI <tspan fill="#314159">•</tspan> Node.js <tspan fill="#314159">•</tspan> PostgreSQL <tspan fill="#314159">•</tspan> Docker
    </text>
  </g>

  <!-- Right Notebook Stamp Motif -->
  <g transform="translate(800, 42)">
    <rect width="112" height="112" rx="10" fill="#192230" stroke="#253245" stroke-width="1"/>
    <circle cx="56" cy="56" r="38" fill="none" stroke="#314159" stroke-width="1" stroke-dasharray="3, 3">
      <animateTransform attributeName="transform" type="rotate" from="0 56 56" to="360 56 56" dur="36s" repeatCount="indefinite"/>
    </circle>
    <circle cx="56" cy="56" r="24" fill="none" stroke="#ea937d" stroke-opacity="0.3" stroke-width="1.2"/>
    <text x="56" y="59" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ea937d" font-weight="700" text-anchor="middle" letter-spacing="1">VJTI</text>
  </g>
</svg>
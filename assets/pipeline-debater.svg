<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 175" width="100%" height="100%">
  <defs>
    <linearGradient id="dbBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0c1017"/>
      <stop offset="100%" stop-color="#121820"/>
    </linearGradient>
    <linearGradient id="dbBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141f2a"/>
      <stop offset="100%" stop-color="#101720"/>
    </linearGradient>
    <style>
      .step-title { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11px; font-weight: 700; fill: #f59e0b; letter-spacing: 0.5px; }
      .step-body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; fill: #cbd5e1; }
      .step-tag { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 9.5px; fill: #8b949e; }
      @keyframes dbFlow { to { stroke-dashoffset: -20; } }
      .db-arrow { stroke-dasharray: 4, 4; animation: dbFlow 1.5s linear infinite; }
    </style>
  </defs>

  <rect width="920" height="175" rx="10" fill="url(#dbBg)" stroke="#1e293b" stroke-width="1.2"/>

  <g transform="translate(25, 22)">
    <circle cx="6" cy="6" r="4" fill="#f59e0b"/>
    <text x="18" y="10" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#f59e0b" letter-spacing="1">
      AI DEBATE ARENA • MULTI-MODEL REASONING &amp; SCORING ORCHESTRATION
    </text>
  </g>

  <!-- Step 1 -->
  <g transform="translate(25, 42)">
    <rect width="200" height="110" rx="8" fill="url(#dbBox)" stroke="#1e293b" stroke-width="1.2"/>
    <text x="14" y="24" class="step-title">01. DEBATE SETUP</text>
    <text x="14" y="46" class="step-body">Topic &amp; motion config</text>
    <text x="14" y="64" class="step-body">Select Model A vs B</text>
    <text x="14" y="82" class="step-body">Difficulty &amp; rounds</text>
    <text x="14" y="100" class="step-tag" fill="#f59e0b">Express.js API</text>
  </g>

  <line class="db-arrow" x1="225" y1="97" x2="255" y2="97" stroke="#f59e0b" stroke-width="1.5"/>
  <polygon points="255,94 261,97 255,100" fill="#f59e0b"/>

  <!-- Step 2 -->
  <g transform="translate(265, 42)">
    <rect width="200" height="110" rx="8" fill="url(#dbBox)" stroke="#1e293b" stroke-width="1.2"/>
    <text x="14" y="24" class="step-title">02. LLM ORCHESTRATOR</text>
    <text x="14" y="46" class="step-body">Turn-based context pipe</text>
    <text x="14" y="64" class="step-body">Prompt state injection</text>
    <text x="14" y="82" class="step-body">OpenRouter gateway</text>
    <text x="14" y="100" class="step-tag" fill="#39d353">Multi-Model Gateway</text>
  </g>

  <line class="db-arrow" x1="465" y1="97" x2="495" y2="97" stroke="#f59e0b" stroke-width="1.5"/>
  <polygon points="495,94 501,97 495,100" fill="#f59e0b"/>

  <!-- Step 3 -->
  <g transform="translate(505, 42)">
    <rect width="200" height="110" rx="8" fill="url(#dbBox)" stroke="#1e293b" stroke-width="1.2"/>
    <text x="14" y="24" class="step-title">03. REBUTTAL ENGINE</text>
    <text x="14" y="46" class="step-body">Cross-examination state</text>
    <text x="14" y="64" class="step-body">Multi-turn memory loop</text>
    <text x="14" y="82" class="step-body">Real-time stream response</text>
    <text x="14" y="100" class="step-tag" fill="#f59e0b">MongoDB Persistence</text>
  </g>

  <line class="db-arrow" x1="705" y1="97" x2="735" y2="97" stroke="#f59e0b" stroke-width="1.5"/>
  <polygon points="735,94 741,97 735,100" fill="#f59e0b"/>

  <!-- Step 4 -->
  <g transform="translate(745, 42)">
    <rect width="150" height="110" rx="8" fill="url(#dbBox)" stroke="#1e293b" stroke-width="1.2"/>
    <text x="14" y="24" class="step-title" fill="#39d353">04. AI JUDGE</text>
    <text x="14" y="46" class="step-body">Fallacy detection</text>
    <text x="14" y="64" class="step-body">Persuasion metrics</text>
    <text x="14" y="82" class="step-body">Dynamic scorecard</text>
    <text x="14" y="100" class="step-tag" fill="#39d353">Objective Evaluation</text>
  </g>
</svg>
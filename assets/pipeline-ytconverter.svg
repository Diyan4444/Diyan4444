<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 175" width="100%" height="100%">
  <defs>
    <linearGradient id="pBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111622"/>
      <stop offset="100%" stop-color="#161c28"/>
    </linearGradient>
  </defs>

  <rect width="920" height="175" rx="10" fill="url(#pBg)" stroke="#253245" stroke-width="1.2"/>

  <!-- Header -->
  <g transform="translate(25, 24)">
    <circle cx="6" cy="4" r="3.5" fill="#ea937d"/>
    <text x="18" y="8" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#f1ede6" letter-spacing="0.8">
      YT-TO-MP4 • ARCHITECTURAL FLOW (CONTAINERISED WEB APP)
    </text>
  </g>

  
  <!-- Step 1 -->
  <g transform="translate(25, 42)">
    <rect width="195" height="110" rx="8" fill="#192230" stroke="#253245" stroke-width="1.2"/>
    <text x="14" y="24" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="700" fill="#ea937d" letter-spacing="0.5">01. RESPONSIVE WEB UI</text>
    <text x="14" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#c7d2df">Dark-mode web client</text>
    <text x="14" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#c7d2df">Real-time progress &amp; ETA</text>
    <text x="14" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#c7d2df">Format &amp; bitrate picker</text>
    <text x="14" y="100" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" fill="#8696a7">Vanilla JavaScript</text>
  </g>
  <line x1="220" y1="97" x2="245" y2="97" stroke="#314159" stroke-width="1.5" stroke-dasharray="3, 3"/>
  <polygon points="245,94 251,97 245,100" fill="#314159"/>
  <!-- Step 2 -->
  <g transform="translate(245, 42)">
    <rect width="195" height="110" rx="8" fill="#192230" stroke="#253245" stroke-width="1.2"/>
    <text x="14" y="24" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="700" fill="#7eb2a8" letter-spacing="0.5">02. FLASK SERVER</text>
    <text x="14" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#c7d2df">Concurrency limiter</text>
    <text x="14" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#c7d2df">URL format verification</text>
    <text x="14" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#c7d2df">Metadata probing &amp; title</text>
    <text x="14" y="100" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" fill="#8696a7">Python • Flask</text>
  </g>
  <line x1="440" y1="97" x2="465" y2="97" stroke="#314159" stroke-width="1.5" stroke-dasharray="3, 3"/>
  <polygon points="465,94 471,97 465,100" fill="#314159"/>
  <!-- Step 3 -->
  <g transform="translate(465, 42)">
    <rect width="195" height="110" rx="8" fill="#192230" stroke="#253245" stroke-width="1.2"/>
    <text x="14" y="24" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="700" fill="#dfb17b" letter-spacing="0.5">03. MEDIA TRANSCODING</text>
    <text x="14" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#c7d2df">Stream video/audio fetch</text>
    <text x="14" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#c7d2df">MP4 &amp; MP3 conversion</text>
    <text x="14" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#c7d2df">Lossless audio extract</text>
    <text x="14" y="100" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" fill="#8696a7">yt-dlp • FFmpeg</text>
  </g>
  <line x1="660" y1="97" x2="685" y2="97" stroke="#314159" stroke-width="1.5" stroke-dasharray="3, 3"/>
  <polygon points="685,94 691,97 685,100" fill="#314159"/>
  <!-- Step 4 -->
  <g transform="translate(685, 42)">
    <rect width="195" height="110" rx="8" fill="#192230" stroke="#253245" stroke-width="1.2"/>
    <text x="14" y="24" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="700" fill="#f1ede6" letter-spacing="0.5">04. CONTAINER CLOUD</text>
    <text x="14" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#c7d2df">Multi-worker Gunicorn</text>
    <text x="14" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#c7d2df">Ephemeral scratch purge</text>
    <text x="14" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#c7d2df">Production container</text>
    <text x="14" y="100" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" fill="#8696a7">Docker • Gunicorn</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 175" width="100%" height="100%">
  <defs>
    <linearGradient id="rsBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0c1017"/>
      <stop offset="100%" stop-color="#121820"/>
    </linearGradient>
    <linearGradient id="rsBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141f2a"/>
      <stop offset="100%" stop-color="#101720"/>
    </linearGradient>
    <style>
      .step-title { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11px; font-weight: 700; fill: #f59e0b; letter-spacing: 0.5px; }
      .step-body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; fill: #cbd5e1; }
      .step-tag { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 9.5px; fill: #8b949e; }
      @keyframes rsFlow { to { stroke-dashoffset: -20; } }
      .rs-arrow { stroke-dasharray: 4, 4; animation: rsFlow 1.5s linear infinite; }
    </style>
  </defs>

  <rect width="920" height="175" rx="10" fill="url(#rsBg)" stroke="#1e293b" stroke-width="1.2"/>

  <g transform="translate(25, 22)">
    <circle cx="6" cy="6" r="4" fill="#f59e0b"/>
    <text x="18" y="10" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#f59e0b" letter-spacing="1">
      RUNE-STRIKER • GODOT 4.6 2D PLATFORMER ARCHITECTURE &amp; GAMEPLAY LOOP
    </text>
  </g>

  <!-- Step 1 -->
  <g transform="translate(25, 42)">
    <rect width="200" height="110" rx="8" fill="url(#rsBox)" stroke="#1e293b" stroke-width="1.2"/>
    <text x="14" y="24" class="step-title">01. PLAYER PHYSICS</text>
    <text x="14" y="46" class="step-body">Coyote Time jump grace</text>
    <text x="14" y="64" class="step-body">Input buffering queue</text>
    <text x="14" y="82" class="step-body">IDLE → RUN → JUMP FSM</text>
    <text x="14" y="100" class="step-tag" fill="#f59e0b">Godot 4.6 • CharacterBody2D</text>
  </g>

  <line class="rs-arrow" x1="225" y1="97" x2="255" y2="97" stroke="#f59e0b" stroke-width="1.5"/>
  <polygon points="255,94 261,97 255,100" fill="#f59e0b"/>

  <!-- Step 2 -->
  <g transform="translate(265, 42)">
    <rect width="200" height="110" rx="8" fill="url(#rsBox)" stroke="#1e293b" stroke-width="1.2"/>
    <text x="14" y="24" class="step-title">02. ENEMY RAYCAST AI</text>
    <text x="14" y="46" class="step-body">Patrolling slime enemies</text>
    <text x="14" y="64" class="step-body">Wall &amp; ledge raycasting</text>
    <text x="14" y="82" class="step-body">Deadly spikes &amp; hazards</text>
    <text x="14" y="100" class="step-tag" fill="#39d353">GDScript Vector Physics</text>
  </g>

  <line class="rs-arrow" x1="465" y1="97" x2="495" y2="97" stroke="#f59e0b" stroke-width="1.5"/>
  <polygon points="495,94 501,97 495,100" fill="#f59e0b"/>

  <!-- Step 3 -->
  <g transform="translate(505, 42)">
    <rect width="200" height="110" rx="8" fill="url(#rsBox)" stroke="#1e293b" stroke-width="1.2"/>
    <text x="14" y="24" class="step-title">03. GAME MANAGER</text>
    <text x="14" y="46" class="step-body">Coin collect event bus</text>
    <text x="14" y="64" class="step-body">In-game HUD coin display</text>
    <text x="14" y="82" class="step-body">Contextual NPC dialogues</text>
    <text x="14" y="100" class="step-tag" fill="#f59e0b">Decoupled Signal Flow</text>
  </g>

  <line class="rs-arrow" x1="705" y1="97" x2="735" y2="97" stroke="#f59e0b" stroke-width="1.5"/>
  <polygon points="735,94 741,97 735,100" fill="#f59e0b"/>

  <!-- Step 4 -->
  <g transform="translate(745, 42)">
    <rect width="150" height="110" rx="8" fill="url(#rsBox)" stroke="#1e293b" stroke-width="1.2"/>
    <text x="14" y="24" class="step-title" fill="#39d353">04. DEPLOYMENT</text>
    <text x="14" y="46" class="step-body">Victory portal cutscene</text>
    <text x="14" y="64" class="step-body">Death &amp; retry reload</text>
    <text x="14" y="82" class="step-body">Playable .exe package</text>
    <text x="14" y="100" class="step-tag" fill="#39d353">Windows Standalone</text>
  </g>
</svg>
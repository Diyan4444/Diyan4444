<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" width="100%" height="100%">
  <defs>
    <linearGradient id="sumBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111622"/>
      <stop offset="100%" stop-color="#161c28"/>
    </linearGradient>

    <style>
      .sum-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 14.5px;
        font-weight: 700;
        fill: #f1ede6;
      }
      .sum-sub {
        font-family: 'JetBrains Mono', Consolas, monospace;
        font-size: 10px;
        fill: #ea937d;
        letter-spacing: 0.8px;
        font-weight: 600;
      }
      .card-num {
        font-family: 'JetBrains Mono', Consolas, monospace;
        font-size: 26px;
        font-weight: 700;
      }
      .card-label {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 11px;
        fill: #8696a7;
        letter-spacing: 0.2px;
      }
      .lang-label {
        font-family: 'JetBrains Mono', Consolas, monospace;
        font-size: 10.5px;
        fill: #c7d2df;
      }
    </style>
  </defs>

  <rect width="960" height="200" rx="12" fill="url(#sumBg)" stroke="#253245" stroke-width="1.2"/>

  <!-- Section Header -->
  <g transform="translate(40, 30)">
    <text class="sum-sub">ACTIVITY &amp; COMMUNITY SNAPSHOT</text>
    <text y="20" class="sum-title">GitHub Overview &amp; Languages</text>
  </g>

  <!-- Metric Tile 1: Repositories & Followers -->
  <g transform="translate(40, 80)">
    <rect width="160" height="96" rx="8" fill="#192230" stroke="#253245" stroke-width="1"/>
    <text x="16" y="24" class="card-label">Repositories &amp; Stars</text>
    <text x="16" y="58" class="card-num" fill="#f1ede6">26 <tspan font-size="13" font-weight="500">repos</tspan></text>
    <text x="16" y="80" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#7eb2a8">• 1 follower · 11 stars</text>
  </g>

  <!-- Metric Tile 2: Commits & Contributions -->
  <g transform="translate(215, 80)">
    <rect width="160" height="96" rx="8" fill="#192230" stroke="#253245" stroke-width="1"/>
    <text x="16" y="24" class="card-label">Commits &amp; Activity</text>
    <text x="16" y="58" class="card-num" fill="#ea937d">167 <tspan font-size="13" font-weight="500">commits</tspan></text>
    <text x="16" y="80" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#8696a7">• 245 yr contributions</text>
  </g>

  <!-- Metric Tile 3: Pull Requests, Issues & Streak -->
  <g transform="translate(390, 80)">
    <rect width="160" height="96" rx="8" fill="#192230" stroke="#253245" stroke-width="1"/>
    <text x="16" y="24" class="card-label">PRs, Issues &amp; Streak</text>
    <text x="16" y="58" class="card-num" fill="#dfb17b">9 <tspan font-size="13" font-weight="500">day streak</tspan></text>
    <text x="16" y="80" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#dfb17b">• 9 PRs · 1 issue</text>
  </g>

  <!-- Languages Breakdown (Right Card) -->
  <g transform="translate(565, 80)">
    <rect width="355" height="96" rx="8" fill="#192230" stroke="#253245" stroke-width="1"/>
    <text x="18" y="22" class="card-label">Authored Languages</text>
    
    <!-- Language 1: TypeScript (66.4%) -->
    <g transform="translate(18, 33)">
      <text x="0" y="8" class="lang-label">TypeScript</text>
      <text x="110" y="8" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#8696a7" text-anchor="end">66.4%</text>
      <rect x="120" y="1" width="195" height="7" rx="3.5" fill="#111622"/>
      <rect x="120" y="1" width="129.5" height="7" rx="3.5" fill="#ea937d"/>
    </g>
    <!-- Language 2: JavaScript (16.3%) -->
    <g transform="translate(18, 48)">
      <text x="0" y="8" class="lang-label">JavaScript</text>
      <text x="110" y="8" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#8696a7" text-anchor="end">16.3%</text>
      <rect x="120" y="1" width="195" height="7" rx="3.5" fill="#111622"/>
      <rect x="120" y="1" width="31.8" height="7" rx="3.5" fill="#7eb2a8"/>
    </g>
    <!-- Language 3: C++ (7.4%) -->
    <g transform="translate(18, 63)">
      <text x="0" y="8" class="lang-label">C++</text>
      <text x="110" y="8" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#8696a7" text-anchor="end">7.4%</text>
      <rect x="120" y="1" width="195" height="7" rx="3.5" fill="#111622"/>
      <rect x="120" y="1" width="14.4" height="7" rx="3.5" fill="#dfb17b"/>
    </g>
    <!-- Language 4: Python (5.6%) -->
    <g transform="translate(18, 78)">
      <text x="0" y="8" class="lang-label">Python</text>
      <text x="110" y="8" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#8696a7" text-anchor="end">5.6%</text>
      <rect x="120" y="1" width="195" height="7" rx="3.5" fill="#111622"/>
      <rect x="120" y="1" width="10.9" height="7" rx="3.5" fill="#64a6bd"/>
    </g>
  </g>
</svg>
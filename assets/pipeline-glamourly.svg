<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 175" width="100%" height="100%">
  <defs>
    <linearGradient id="pBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0c1017"/>
      <stop offset="100%" stop-color="#121820"/>
    </linearGradient>
    <linearGradient id="pBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141f2a"/>
      <stop offset="100%" stop-color="#101720"/>
    </linearGradient>
    <style>
      .step-title { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11px; font-weight: 700; fill: #39d353; letter-spacing: 0.5px; }
      .step-body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; fill: #cbd5e1; }
      .step-tag { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 9.5px; fill: #8b949e; }
      @keyframes pFlow { to { stroke-dashoffset: -20; } }
      .p-arrow { stroke-dasharray: 4, 4; animation: pFlow 1.5s linear infinite; }
    </style>
  </defs>

  <rect width="920" height="175" rx="10" fill="url(#pBg)" stroke="#1e293b" stroke-width="1.2"/>

  <g transform="translate(25, 22)">
    <circle cx="6" cy="6" r="4" fill="#39d353"/>
    <text x="18" y="10" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#39d353" letter-spacing="1">
      GLAMOURLY • ARCHITECTURAL FLOW (MUMBAI SALON PLATFORM)
    </text>
  </g>

  <!-- Step 1 -->
  <g transform="translate(25, 42)">
    <rect width="195" height="110" rx="8" fill="url(#pBox)" stroke="#1e293b" stroke-width="1.2"/>
    <text x="14" y="24" class="step-title">01. DISCOVERY &amp; GEO</text>
    <text x="14" y="46" class="step-body">Mumbai salon filtering</text>
    <text x="14" y="64" class="step-body">Transparent rate cards</text>
    <text x="14" y="82" class="step-body">AI Concierge assistant</text>
    <text x="14" y="100" class="step-tag" fill="#22c55e">Next.js • Tailwind CSS</text>
  </g>

  <line class="p-arrow" x1="220" y1="97" x2="255" y2="97" stroke="#39d353" stroke-width="1.5"/>
  <polygon points="255,94 261,97 255,100" fill="#39d353"/>

  <!-- Step 2 -->
  <g transform="translate(265, 42)">
    <rect width="195" height="110" rx="8" fill="url(#pBox)" stroke="#234932" stroke-width="1.2"/>
    <text x="14" y="24" class="step-title">02. BOOKING ENGINE</text>
    <text x="14" y="46" class="step-body">Real-time slot lock</text>
    <text x="14" y="64" class="step-body">Stylist roster allocation</text>
    <text x="14" y="82" class="step-body">Zero forced prepayment</text>
    <text x="14" y="100" class="step-tag" fill="#22c55e">TypeScript • React</text>
  </g>

  <line class="p-arrow" x1="460" y1="97" x2="495" y2="97" stroke="#39d353" stroke-width="1.5"/>
  <polygon points="495,94 501,97 495,100" fill="#39d353"/>

  <!-- Step 3 -->
  <g transform="translate(505, 42)">
    <rect width="195" height="110" rx="8" fill="url(#pBox)" stroke="#1e293b" stroke-width="1.2"/>
    <text x="14" y="24" class="step-title">03. DATA &amp; COMPLIANCE</text>
    <text x="14" y="46" class="step-body">Shop Act licensing check</text>
    <text x="14" y="64" class="step-body">Provider shift management</text>
    <text x="14" y="82" class="step-body">Customer order history</text>
    <text x="14" y="100" class="step-tag" fill="#22c55e">MongoDB • Node.js</text>
  </g>

  <line class="p-arrow" x1="700" y1="97" x2="735" y2="97" stroke="#39d353" stroke-width="1.5"/>
  <polygon points="735,94 741,97 735,100" fill="#39d353"/>

  <!-- Step 4 -->
  <g transform="translate(745, 42)">
    <rect width="150" height="110" rx="8" fill="url(#pBox)" stroke="#1e293b" stroke-width="1.2"/>
    <text x="14" y="24" class="step-title" fill="#22c55e">04. PASS DISPATCH</text>
    <text x="14" y="46" class="step-body">Instant email pass</text>
    <text x="14" y="64" class="step-body">Google Maps link</text>
    <text x="14" y="82" class="step-body">Status updates</text>
    <text x="14" y="100" class="step-tag" fill="#39d353">Offline Payment</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 175" width="100%" height="100%">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0c1017"/>
      <stop offset="100%" stop-color="#121820"/>
    </linearGradient>
    <linearGradient id="ogBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141f2a"/>
      <stop offset="100%" stop-color="#101720"/>
    </linearGradient>
    <style>
      .step-title { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11px; font-weight: 700; fill: #38bdf8; letter-spacing: 0.5px; }
      .step-body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; fill: #cbd5e1; }
      .step-tag { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 9.5px; fill: #8b949e; }
      @keyframes ogFlow { to { stroke-dashoffset: -20; } }
      .og-arrow { stroke-dasharray: 4, 4; animation: ogFlow 1.5s linear infinite; }
    </style>
  </defs>

  <rect width="920" height="175" rx="10" fill="url(#ogBg)" stroke="#1e293b" stroke-width="1.2"/>

  <g transform="translate(25, 22)">
    <circle cx="6" cy="6" r="4" fill="#38bdf8"/>
    <text x="18" y="10" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#38bdf8" letter-spacing="1">
      OCEANGUARD AI • SAR SATELLITE OIL SPILL &amp; AIS ATTRIBUTION (SIH 2026)
    </text>
  </g>

  <!-- Step 1 -->
  <g transform="translate(25, 42)">
    <rect width="200" height="110" rx="8" fill="url(#ogBox)" stroke="#1e293b" stroke-width="1.2"/>
    <text x="14" y="24" class="step-title">01. SAR SEGMENTATION</text>
    <text x="14" y="46" class="step-body">Satellite radar imagery</text>
    <text x="14" y="64" class="step-body">AI oil slick mask</text>
    <text x="14" y="82" class="step-body">Dark spot extraction</text>
    <text x="14" y="100" class="step-tag" fill="#38bdf8">Computer Vision / AI</text>
  </g>

  <line class="og-arrow" x1="225" y1="97" x2="255" y2="97" stroke="#38bdf8" stroke-width="1.5"/>
  <polygon points="255,94 261,97 255,100" fill="#38bdf8"/>

  <!-- Step 2 -->
  <g transform="translate(265, 42)">
    <rect width="200" height="110" rx="8" fill="url(#ogBox)" stroke="#1e293b" stroke-width="1.2"/>
    <text x="14" y="24" class="step-title">02. DRIFT HINDCASTING</text>
    <text x="14" y="46" class="step-body">Reverse current simulation</text>
    <text x="14" y="64" class="step-body">Wind &amp; hydrodynamic flow</text>
    <text x="14" y="82" class="step-body">Origin coordinate fix</text>
    <text x="14" y="100" class="step-tag" fill="#39d353">NumPy • SciPy</text>
  </g>

  <line class="og-arrow" x1="465" y1="97" x2="495" y2="97" stroke="#38bdf8" stroke-width="1.5"/>
  <polygon points="495,94 501,97 495,100" fill="#38bdf8"/>

  <!-- Step 3 -->
  <g transform="translate(505, 42)">
    <rect width="200" height="110" rx="8" fill="url(#ogBox)" stroke="#1e293b" stroke-width="1.2"/>
    <text x="14" y="24" class="step-title">03. AIS CORRELATION</text>
    <text x="14" y="46" class="step-body">Vessel GPS cross-match</text>
    <text x="14" y="64" class="step-body">Speed anomaly detection</text>
    <text x="14" y="82" class="step-body">AIS blackout gap analysis</text>
    <text x="14" y="100" class="step-tag" fill="#38bdf8">FastAPI • SQLite</text>
  </g>

  <line class="og-arrow" x1="705" y1="97" x2="735" y2="97" stroke="#38bdf8" stroke-width="1.5"/>
  <polygon points="735,94 741,97 735,100" fill="#38bdf8"/>

  <!-- Step 4 -->
  <g transform="translate(745, 42)">
    <rect width="150" height="110" rx="8" fill="url(#ogBox)" stroke="#1e293b" stroke-width="1.2"/>
    <text x="14" y="24" class="step-title" fill="#39d353">04. ATTRIBUTION</text>
    <text x="14" y="46" class="step-body">Suspect confidence score</text>
    <text x="14" y="64" class="step-body">CartoDB dark maps</text>
    <text x="14" y="82" class="step-body">Evidence reporting</text>
    <text x="14" y="100" class="step-tag" fill="#39d353">React 19 • Leaflet</text>
  </g>
</svg>